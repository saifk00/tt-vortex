[build-system]
requires = ["setuptools>=77", "wheel", "cmake>=3.26", "ninja", "nanobind==2.10.2", "triton==3.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-vortex"
version = "0.1.0"
description = "Experimental Vortex backend for Triton"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["triton==3.9.0", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/saifk00/tt-vortex"

[project.entry-points."triton.backends"]
vortex = "tt_vortex"

[tool.setuptools]
packages = ["tt_vortex", "triton.tools.extra.vortex"]

[tool.setuptools.package-dir]
tt_vortex = "backend"
"triton.tools.extra.vortex" = "tools/vortex"

[tool.setuptools.package-data]
"triton.tools.extra.vortex" = ["compile.*"]
